<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560">
  <defs>
    <marker id="arrMG" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#64748b"/>
    </marker>
    <filter id="nodeShadowMG" x="-60%" y="-60%" width="220%" height="220%">
