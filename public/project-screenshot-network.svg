<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <defs>
    <marker id="arrN" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <filter id="cardShadowN" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="gridN" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="500" fill="#0b1220"/>
  <rect width="600" height="500" fill="url(#gridN)"/>

  <!-- Chrome header -->
  <text x="24" y="30" fill="#7c93b8" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">ARCHITECTURE OVERVIEW</text>
  <circle cx="562" cy="26" r="2.6" fill="#475569"/>
  <circle cx="574" cy="26" r="2.6" fill="#475569"/>
  <circle cx="586" cy="26" r="2.6" fill="#475569"/>
  <line x1="0" y1="44" x2="600" y2="44" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <g filter="url(#cardShadowN)">
    <!-- Row 1: Live Interface -->
    <rect x="215" y="62" width="170" height="56" rx="10" fill="#1e3a5f"/>
    <text x="300" y="86" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Live Interface</text>
    <text x="300" y="103" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">NIC · promiscuous mode</text>
  </g>

  <line x1="300" y1="118" x2="300" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#arrN)"/>

  <g filter="url(#cardShadowN)">
    <!-- Row 2: Packet Sniffer -->
    <rect x="215" y="146" width="170" height="56" rx="10" fill="#134e4a"/>
    <text x="300" y="170" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Packet Sniffer</text>
    <text x="300" y="187" text-anchor="middle" fill="#5eead4" font-family="Arial,sans-serif" font-size="11">Scapy · raw frame capture</text>
  </g>

  <line x1="300" y1="202" x2="300" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#arrN)"/>

  <g filter="url(#cardShadowN)">
    <!-- Row 3: Frame Parser -->
    <rect x="215" y="230" width="170" height="56" rx="10" fill="#1e293b"/>
    <text x="300" y="254" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Frame Parser</text>
    <text x="300" y="271" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Ethernet · IP · TCP/UDP decode</text>
  </g>

  <line x1="215" y1="262" x2="150" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrN)"/>
  <line x1="385" y1="262" x2="450" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrN)"/>

  <g filter="url(#cardShadowN)">
    <!-- Row 4: ARP/Spoof Detector (left) + Recon Scanner (right) -->
    <rect x="40" y="314" width="220" height="60" rx="10" fill="#7c2d12"/>
    <text x="150" y="338" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">ARP / Spoof Detector</text>
    <text x="150" y="356" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="11">IP · MAC mismatch analysis</text>

    <rect x="340" y="314" width="220" height="60" rx="10" fill="#4c1d95"/>
    <text x="450" y="338" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Recon Scanner</text>
    <text x="450" y="356" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="11">Nmap · source tracing</text>
  </g>

  <line x1="160" y1="374" x2="270" y2="404" stroke="#64748b" stroke-width="2" marker-end="url(#arrN)"/>
  <line x1="440" y1="374" x2="330" y2="404" stroke="#64748b" stroke-width="2" marker-end="url(#arrN)"/>

  <g filter="url(#cardShadowN)">
    <!-- Row 5: Data Aggregator -->
    <rect x="215" y="408" width="170" height="56" rx="10" fill="#14532d"/>
    <text x="300" y="432" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Data Aggregator</text>
    <text x="300" y="449" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="11">Pandas · protocol breakdown</text>
  </g>

  <!-- Row 6: Outputs -->
  <line x1="240" y1="464" x2="150" y2="486" stroke="#64748b" stroke-width="2"/>
  <line x1="300" y1="464" x2="300" y2="486" stroke="#64748b" stroke-width="2"/>
  <line x1="360" y1="464" x2="450" y2="486" stroke="#64748b" stroke-width="2"/>

  <text x="150" y="494" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-size="11" font-weight="700">Matplotlib charts</text>
  <text x="300" y="494" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-size="11" font-weight="700">CLI alert log</text>
  <text x="450" y="494" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-size="11" font-weight="700">.pcap export</text>
</svg>
