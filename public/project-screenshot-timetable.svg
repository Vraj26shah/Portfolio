<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480">
  <defs>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <filter id="cardShadowT" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="gridT" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="480" fill="#0b1220"/>
  <rect width="600" height="480" fill="url(#gridT)"/>

  <!-- Chrome header -->
  <text x="24" y="30" fill="#7c93b8" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">ARCHITECTURE OVERVIEW</text>
  <circle cx="562" cy="26" r="2.6" fill="#475569"/>
  <circle cx="574" cy="26" r="2.6" fill="#475569"/>
  <circle cx="586" cy="26" r="2.6" fill="#475569"/>
  <line x1="0" y1="44" x2="600" y2="44" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <g filter="url(#cardShadowT)">
    <!-- Row 1: User / Browser -->
    <rect x="215" y="62" width="170" height="60" rx="10" fill="#1e3a5f"/>
    <text x="300" y="88" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">User / Browser</text>
    <text x="300" y="105" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Scheduling interface</text>
  </g>

  <line x1="300" y1="122" x2="300" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#arrT)"/>

  <g filter="url(#cardShadowT)">
    <!-- Row 2: HTML/CSS Layer -->
    <rect x="215" y="152" width="170" height="60" rx="10" fill="#1e40af"/>
    <text x="300" y="178" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">HTML / CSS Layer</text>
    <text x="300" y="195" text-anchor="middle" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="11">Grid, forms, responsive</text>
  </g>

  <line x1="300" y1="212" x2="300" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#arrT)"/>

  <g filter="url(#cardShadowT)">
    <!-- Row 3: JavaScript Engine -->
    <rect x="215" y="242" width="170" height="60" rx="10" fill="#92400e"/>
    <text x="300" y="268" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">JavaScript Engine</text>
    <text x="300" y="285" text-anchor="middle" fill="#fde68a" font-family="Arial,sans-serif" font-size="11">Constraint solver</text>
  </g>

  <line x1="215" y1="272" x2="170" y2="332" stroke="#64748b" stroke-width="2" marker-end="url(#arrT)"/>
  <line x1="300" y1="302" x2="300" y2="332" stroke="#64748b" stroke-width="2" marker-end="url(#arrT)"/>
  <line x1="385" y1="272" x2="430" y2="332" stroke="#64748b" stroke-width="2" marker-end="url(#arrT)"/>

  <g filter="url(#cardShadowT)">
    <!-- Row 4: LocalStorage, Schedule Grid, Export -->
    <rect x="28" y="338" width="140" height="60" rx="10" fill="#14532d"/>
    <text x="98" y="363" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="12" font-weight="700">LocalStorage</text>
    <text x="98" y="381" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="11">Auto-save sessions</text>

    <rect x="215" y="338" width="170" height="60" rx="10" fill="#374151"/>
    <text x="300" y="363" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="12" font-weight="700">Schedule Grid</text>
    <text x="300" y="381" text-anchor="middle" fill="#d1d5db" font-family="Arial,sans-serif" font-size="11">Day / slot display</text>

    <rect x="432" y="338" width="140" height="60" rx="10" fill="#4c1d95"/>
    <text x="502" y="363" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="12" font-weight="700">Print / Export</text>
    <text x="502" y="381" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="11">PDF, share link</text>
  </g>

  <line x1="300" y1="398" x2="300" y2="418" stroke="#64748b" stroke-width="2" marker-end="url(#arrT)"/>

  <g filter="url(#cardShadowT)">
    <!-- Row 5: Vercel CDN -->
    <rect x="215" y="422" width="170" height="30" rx="8" fill="#1e3a5f"/>
    <text x="300" y="441" text-anchor="middle" fill="#93c5fd" font-family="Arial,sans-serif" font-size="11" font-weight="700">Vercel CDN — Global deploy</text>
  </g>
</svg>
