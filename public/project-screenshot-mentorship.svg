<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <filter id="cardShadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="gridM" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="480" fill="#0b1220"/>
  <rect width="600" height="480" fill="url(#gridM)"/>

  <!-- Chrome header -->
  <text x="24" y="30" fill="#7c93b8" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">ARCHITECTURE OVERVIEW</text>
  <circle cx="562" cy="26" r="2.6" fill="#475569"/>
  <circle cx="574" cy="26" r="2.6" fill="#475569"/>
  <circle cx="586" cy="26" r="2.6" fill="#475569"/>
  <line x1="0" y1="44" x2="600" y2="44" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <g filter="url(#cardShadowM)">
    <!-- Row 1: Student Input (left) + Mentor Pool (right) -->
    <rect x="40" y="64" width="170" height="64" rx="10" fill="#1e3a5f"/>
    <text x="125" y="90" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Student Input</text>
    <text x="125" y="108" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Doubt · goals · profile</text>

    <rect x="390" y="64" width="170" height="64" rx="10" fill="#1e3a5f"/>
    <text x="475" y="90" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Mentor Pool</text>
    <text x="475" y="108" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">4,800+ vetted mentors</text>
  </g>

  <line x1="210" y1="96" x2="268" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="390" y1="96" x2="332" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#cardShadowM)">
    <!-- Row 2: Gemini Doubt Analysis -->
    <rect x="215" y="144" width="170" height="64" rx="10" fill="#7c2d12"/>
    <text x="300" y="170" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Gemini Doubt Analysis</text>
    <text x="300" y="188" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="11">Feature scoring</text>
  </g>

  <line x1="300" y1="208" x2="300" y2="234" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#cardShadowM)">
    <!-- Row 3: Feature Extractor -->
    <rect x="215" y="242" width="170" height="64" rx="10" fill="#14532d"/>
    <text x="300" y="268" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Feature Extractor</text>
    <text x="300" y="286" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="11">Vector embeddings</text>
  </g>

  <line x1="215" y1="274" x2="170" y2="336" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="385" y1="274" x2="430" y2="336" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#cardShadowM)">
    <!-- Row 4: Decision Tree (left) + Genetic Optimizer (right) -->
    <rect x="40" y="342" width="170" height="64" rx="10" fill="#4c1d95"/>
    <text x="125" y="368" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Decision Tree</text>
    <text x="125" y="386" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="11">Classification paths</text>

    <rect x="390" y="342" width="170" height="64" rx="10" fill="#92400e"/>
    <text x="475" y="368" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Genetic Algorithm</text>
    <text x="475" y="386" text-anchor="middle" fill="#fde68a" font-family="Arial,sans-serif" font-size="11">Optimisation loop</text>
  </g>

  <line x1="210" y1="374" x2="258" y2="412" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="390" y1="374" x2="342" y2="412" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#cardShadowM)">
    <!-- Row 5: Match Recommendation -->
    <rect x="215" y="418" width="170" height="34" rx="8" fill="#065f46"/>
    <text x="300" y="440" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="12" font-weight="700">Mentor Match · 98% Resolution</text>
  </g>
</svg>
