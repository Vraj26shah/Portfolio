<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560">
  <defs>
    <marker id="arrS" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#64748b"/>
    </marker>
    <filter id="nodeShadowS" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="gridS" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="560" fill="#0b1220"/>
  <rect width="600" height="560" fill="url(#gridS)"/>

  <text x="24" y="30" fill="#7c93b8" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">ARCHITECTURE OVERVIEW</text>
  <circle cx="562" cy="26" r="2.6" fill="#475569"/>
  <circle cx="574" cy="26" r="2.6" fill="#475569"/>
  <circle cx="586" cy="26" r="2.6" fill="#475569"/>
  <line x1="0" y1="44" x2="600" y2="44" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- wiring -->
  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <line x1="300" y1="122" x2="300" y2="138" marker-end="url(#arrS)"/>
    <line x1="300" y1="202" x2="300" y2="218" marker-end="url(#arrS)"/>
    <path d="M300,282 L130,308" marker-end="url(#arrS)"/>
    <line x1="300" y1="282" x2="300" y2="308" marker-end="url(#arrS)"/>
    <path d="M300,282 L470,308" marker-end="url(#arrS)"/>
    <line x1="130" y1="372" x2="130" y2="398" marker-end="url(#arrS)"/>
    <line x1="300" y1="372" x2="300" y2="398" marker-end="url(#arrS)"/>
    <line x1="470" y1="372" x2="470" y2="398" marker-end="url(#arrS)"/>
  </g>

  <!-- Students -->
  <g filter="url(#nodeShadowS)"><circle cx="300" cy="90" r="32" fill="#2b220f" stroke="#ffd86d" stroke-width="1.6"/></g>
  <g transform="translate(285,75) scale(1.25)" stroke="#ffd86d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </g>
  <text x="300" y="140" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">STUDENTS</text>

  <!-- CDN edge -->
  <g filter="url(#nodeShadowS)"><circle cx="300" cy="170" r="32" fill="#0f2436" stroke="#7bdcff" stroke-width="1.6"/></g>
  <g transform="translate(285,155) scale(1.25)" stroke="#7bdcff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
  </g>
  <text x="300" y="220" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">CDN EDGE</text>

  <!-- API Gateway -->
  <g filter="url(#nodeShadowS)"><circle cx="300" cy="250" r="32" fill="#0f2436" stroke="#7bdcff" stroke-width="1.6"/></g>
  <g transform="translate(285,235) scale(1.25)" stroke="#7bdcff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
    <line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>
  </g>
  <text x="300" y="300" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">API GATEWAY</text>

  <!-- Auth -->
  <g filter="url(#nodeShadowS)"><circle cx="130" cy="340" r="32" fill="#0f2436" stroke="#7bdcff" stroke-width="1.6"/></g>
  <g transform="translate(115,325) scale(1.25)" stroke="#7bdcff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </g>
  <text x="130" y="390" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.4">AUTH</text>

  <!-- Content -->
  <g filter="url(#nodeShadowS)"><circle cx="300" cy="340" r="32" fill="#0f2436" stroke="#7bdcff" stroke-width="1.6"/></g>
  <g transform="translate(285,325) scale(1.25)" stroke="#7bdcff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
  </g>
  <text x="300" y="390" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.4">CONTENT</text>

  <!-- Payments -->
  <g filter="url(#nodeShadowS)"><circle cx="470" cy="340" r="32" fill="#0f2436" stroke="#7bdcff" stroke-width="1.6"/></g>
  <g transform="translate(455,325) scale(1.25)" stroke="#7bdcff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>
  </g>
  <text x="470" y="390" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.4">PAYMENTS</text>

  <!-- Postgres -->
  <g filter="url(#nodeShadowS)"><circle cx="130" cy="430" r="32" fill="#2a0f1c" stroke="#ff6aa6" stroke-width="1.6"/></g>
  <g transform="translate(115,415) scale(1.25)" stroke="#ff6aa6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
  </g>
  <text x="130" y="480" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.4">POSTGRES</text>

  <!-- Object storage -->
  <g filter="url(#nodeShadowS)"><circle cx="300" cy="430" r="32" fill="#2a0f1c" stroke="#ff6aa6" stroke-width="1.6"/></g>
  <g transform="translate(285,415) scale(1.25)" stroke="#ff6aa6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="22" y1="12" x2="2" y2="12"/>
    <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
    <line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/>
  </g>
  <text x="300" y="480" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.3">OBJECT STORAGE</text>

  <!-- Redis -->
  <g filter="url(#nodeShadowS)"><circle cx="470" cy="430" r="32" fill="#2a0f1c" stroke="#ff6aa6" stroke-width="1.6"/></g>
  <g transform="translate(455,415) scale(1.25)" stroke="#ff6aa6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
  </g>
  <text x="470" y="480" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.4">REDIS</text>
</svg>
